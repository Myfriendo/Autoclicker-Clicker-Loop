[package]
name = "clicker-loop"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
